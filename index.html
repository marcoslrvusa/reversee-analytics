<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0908">
<title>Reversee · Acesso ao painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --red:#E31919;--red-hi:#FF4A3D;--ink:#0A0908;--ink2:#12100E;
  --txt:#F4F0EA;--muted:#A79F94;--dim:#7B7369;--line:rgba(255,255,255,.09);
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}

/* ---------- fundo ---------- */
.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#17110F 0%,var(--ink) 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,#E31919 0%,rgba(227,25,25,0) 68%);animation:f1 19s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;right:-14vmax;bottom:-12vmax;background:radial-gradient(circle,#2A9468 0%,rgba(42,148,104,0) 68%);opacity:.38;animation:f2 23s ease-in-out infinite alternate}
.b3{width:30vmax;height:30vmax;left:46%;top:38%;background:radial-gradient(circle,#7757C4 0%,rgba(119,87,196,0) 70%);opacity:.22;animation:f3 27s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes f2{to{transform:translate(-16vmax,-10vmax) scale(1.2)}}
@keyframes f3{to{transform:translate(-22vmax,-14vmax) scale(.8)}}
.grid{position:absolute;inset:-50% -20% 0 -20%;top:45%;height:120%;background:
  linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/64px 64px,
  linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/64px 64px;
  transform:perspective(520px) rotateX(62deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 78%);mask-image:linear-gradient(to bottom,#000 0%,transparent 78%);
  animation:gridmove 7s linear infinite}
@keyframes gridmove{to{background-position:0 64px,64px 0}}
#net{position:absolute;inset:0;width:100%;height:100%}
.noise{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}

/* ---------- palco ---------- */
.stage{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:20px;perspective:1100px}
.card{position:relative;width:100%;max-width:420px;border-radius:22px;padding:1px;
  background:conic-gradient(from var(--a),rgba(255,255,255,.04),rgba(227,25,25,.95) 12%,rgba(255,255,255,.04) 28%,rgba(255,255,255,.04) 60%,rgba(42,148,104,.8) 76%,rgba(255,255,255,.04) 90%);
  animation:spin 7s linear infinite,rise .9s cubic-bezier(.2,.8,.2,1) both;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;
  box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 90px rgba(227,25,25,.12)}
@keyframes spin{to{--a:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}}
.inner{position:relative;border-radius:21px;padding:34px 30px 26px;overflow:hidden;
  background:linear-gradient(160deg,rgba(26,22,19,.92),rgba(12,10,9,.94));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.inner::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.085),transparent 60%)}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

.logos{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:26px}
.logos .rv{height:74px;width:auto;filter:drop-shadow(0 6px 22px rgba(227,25,25,.35))}
.logos .v4{height:27px;width:auto;opacity:.92}
.logos .x{width:1px;height:52px;background:linear-gradient(transparent,rgba(255,255,255,.28),transparent)}
.logos img{display:block;animation:fadeup .8s .15s both}
.logos .x{animation:fadeup .8s .25s both}
.logos .v4{animation:fadeup .8s .35s both}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--m);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#ffb3ab;background:rgba(227,25,25,.12);border:1px solid rgba(227,25,25,.32);padding:5px 11px;border-radius:99px;animation:fadeup .8s .45s both}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--red-hi);box-shadow:0 0 0 0 rgba(255,74,61,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(255,74,61,0)}100%{box-shadow:0 0 0 0 rgba(255,74,61,0)}}
h1{font-size:25px;line-height:1.15;letter-spacing:-.025em;font-weight:800;margin:14px 0 6px;animation:fadeup .8s .52s both}
h1 em{font-style:normal;background:linear-gradient(90deg,#FF6A5E,#E31919 60%,#FF9B6A);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--muted);font-size:14px;margin-bottom:22px;animation:fadeup .8s .6s both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}

.field{position:relative;animation:fadeup .8s .68s both}
.field .lk{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--dim);transition:color .2s;pointer-events:none}
.field input{width:100%;font:inherit;font-size:16px;color:var(--txt);letter-spacing:.02em;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:20px 46px 8px 42px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.field label{position:absolute;left:42px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--dim);pointer-events:none;transition:all .18s ease;transform-origin:left}
.field input:focus,.field input:not(:placeholder-shown){padding-top:20px}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:12px;transform:translateY(0) scale(.76);color:var(--muted)}
.field input:focus{border-color:rgba(227,25,25,.8);background:rgba(255,255,255,.07);box-shadow:0 0 0 4px rgba(227,25,25,.15)}
.field:focus-within .lk{color:var(--red-hi)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--dim);cursor:pointer;border-radius:9px;display:grid;place-items:center;transition:color .15s,background .15s}
.eye:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.eye svg{width:18px;height:18px}
.caps{display:none;margin-top:8px;font-size:12px;color:#F2B25C;font-family:var(--m)}
.caps.on{display:block}

button.go{position:relative;overflow:hidden;width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:15.5px;letter-spacing:.01em;color:#fff;border:0;border-radius:12px;padding:14px;cursor:pointer;
  background:linear-gradient(180deg,#F02A22,#C81212);box-shadow:0 10px 30px rgba(227,25,25,.35),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,box-shadow .2s,filter .2s;animation:fadeup .8s .76s both}
button.go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-20deg);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
button.go:hover{transform:translateY(-1px);box-shadow:0 14px 38px rgba(227,25,25,.5),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.06)}
button.go:active{transform:translateY(1px)}
button.go:disabled{cursor:progress;filter:saturate(.7)}
button.go .sp{display:none;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:8px}
button.go.busy .sp{display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.err{min-height:22px;margin-top:10px;font-size:13px;color:#FF8B80;text-align:center}
.foot{margin-top:10px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--dim);font-family:var(--m);animation:fadeup .8s .9s both}
.foot b{font-weight:600;color:var(--muted)}

/* sucesso: cadeado abre + íris revela o painel */
.card.ok .inner{animation:okpulse .7s ease both}
@keyframes okpulse{40%{transform:scale(.985)}100%{transform:scale(1.02);opacity:.0}}
.iris{position:fixed;z-index:9;left:var(--cx,50%);top:var(--cy,50%);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#F5F2EE;transform:scale(0);pointer-events:none;box-shadow:0 0 120px 60px rgba(245,242,238,.6)}
.iris.go{animation:iris .9s cubic-bezier(.6,.0,.2,1) forwards}
@keyframes iris{to{transform:scale(900)}}
.badge-ok{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;display:flex;flex-direction:column;align-items:center;gap:10px;color:#1A1613;font-weight:700;pointer-events:none}
.badge-ok svg{width:64px;height:64px}
.badge-ok.on{animation:pop .9s .15s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes pop{30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.circ{stroke-dasharray:166;stroke-dashoffset:166}.tick{stroke-dasharray:48;stroke-dashoffset:48}
.badge-ok.on .circ{animation:draw .5s .25s ease forwards}.badge-ok.on .tick{animation:draw .35s .65s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

@media (max-width:480px){.inner{padding:28px 22px 22px}h1{font-size:22px}.logos .rv{height:60px}.logos .v4{height:22px}.foot{flex-direction:column;align-items:center;gap:2px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.blob,.grid{animation:none!important}}
</style>
</head>

  var $=function(i){return document.getElementById(i)};
  var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
  var b64e=function(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function open(html){document.open();document.write(html);document.close()}
  async function decrypt(key){var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));return new TextDecoder().decode(buf)}
  async function deriveRaw(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,256));
  }
  function importKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}

  /* ---- partículas ---- */
  (function(){
    var c=$('net'),x=c.getContext('2d'),W,H,P=[],M={x:-999,y:-999},dpr=Math.min(window.devicePixelRatio||1,2),run=true;
    function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
      var n=Math.round(Math.min(90,innerWidth*innerHeight/16000));P=[];for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35*dpr,vy:(Math.random()-.5)*.35*dpr,r:(Math.random()*1.4+.6)*dpr,h:Math.random()<.22})}
    size();addEventListener('resize',size);
    addEventListener('pointermove',function(e){M.x=e.clientX*dpr;M.y=e.clientY*dpr});
    document.addEventListener('visibilitychange',function(){run=!document.hidden;if(run)tick()});
    function tick(){
      if(!run)return;x.clearRect(0,0,W,H);var D=150*dpr;
      for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
        var dx=M.x-p.x,dy=M.y-p.y,d=Math.hypot(dx,dy);if(d<180*dpr){p.x-=dx*.0016;p.y-=dy*.0016}
        x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=p.h?'rgba(255,90,75,.85)':'rgba(255,255,255,.55)';x.fill();
        for(var j=i+1;j<P.length;j++){var q=P[j],ex=p.x-q.x,ey=p.y-q.y,e=Math.hypot(ex,ey);
          if(e<D){x.strokeStyle='rgba('+(p.h||q.h?'255,90,75':'255,255,255')+','+(.16*(1-e/D)).toFixed(3)+')';x.lineWidth=dpr*.8;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
        if(d<200*dpr){x.strokeStyle='rgba(255,90,75,'+(.28*(1-d/(200*dpr))).toFixed(3)+')';x.lineWidth=dpr;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(M.x,M.y);x.stroke()}}
      if(!reduce)requestAnimationFrame(tick)
    }
    tick();
  })();

  /* ---- tilt + spotlight ---- */
  var card=$('card'),inner=card.querySelector('.inner');
  if(!reduce&&matchMedia('(pointer:fine)').matches){
    addEventListener('pointermove',function(e){
      var r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
      var nx=(e.clientX/innerWidth-.5),ny=(e.clientY/innerHeight-.5);
      card.style.setProperty('--ry',(nx*7).toFixed(2)+'deg');card.style.setProperty('--rx',(-ny*6).toFixed(2)+'deg');
      inner.style.setProperty('--mx',(px*100).toFixed(1)+'%');inner.style.setProperty('--my',(py*100).toFixed(1)+'%')
    });
  }

  if(!window.crypto||!crypto.subtle){$('err').textContent='Este navegador não suporta o acesso seguro. Use um navegador atualizado (https).';$('go').disabled=true;return}

  /* ---- sessão (mesma aba) ---- */
  try{var k=sessionStorage.getItem('rv-k');if(k){importKey(b64(k)).then(decrypt).then(open).catch(function(){sessionStorage.removeItem('rv-k')})}}catch(_){}

  /* ---- UI ---- */
  var EYE='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
      EYEOFF='<path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
  $('eye').onclick=function(){var p=$('pw'),s=p.type==='password';p.type=s?'text':'password';$('eyeI').innerHTML=s?EYEOFF:EYE;p.focus()};
  $('pw').addEventListener('keyup',function(e){$('caps').classList.toggle('on',!!(e.getModifierState&&e.getModifierState('CapsLock')))});
  $('pw').addEventListener('input',function(){$('err').textContent=''});

  function success(html){
    var r=$('go').getBoundingClientRect();
    $('iris').style.setProperty('--cx',(r.left+r.width/2)+'px');$('iris').style.setProperty('--cy',(r.top+r.height/2)+'px');
    card.classList.add('ok');
    setTimeout(function(){$('iris').classList.add('go');$('bok').classList.add('on')},reduce?0:380);
    setTimeout(function(){open(html)},reduce?50:1500);
  }

  $('card').onsubmit=async function(e){
    e.preventDefault();$('err').textContent='';$('go').disabled=true;$('go').classList.add('busy');$('gl').textContent='Verificando…';
    var t0=Date.now(),raw,html;
    try{raw=await deriveRaw($('pw').value);html=await decrypt(await importKey(raw))}
    catch(_){
      var w=Math.max(0,500-(Date.now()-t0));await new Promise(function(r){setTimeout(r,w)});
      $('err').textContent='Senha incorreta. Confira e tente de novo.';
      $('go').disabled=false;$('go').classList.remove('busy');$('gl').textContent='Entrar no painel';
      inner.classList.remove('shake');void inner.offsetWidth;inner.classList.add('shake');$('pw').select();return;
    }
    try{sessionStorage.setItem('rv-k',b64e(raw))}catch(_){}
    $('gl').textContent='Acesso liberado';$('go').classList.remove('busy');
    success(html);
  };
})();
