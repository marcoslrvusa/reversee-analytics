<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reversee · Acesso ao painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#E31919;--red-600:#C11414;--red-050:#FDEDEB;--bg:#F5F2EE;--panel:#fff;--line:#E8E3DB;--line2:#D7D1C6;--txt:#1A1613;--muted:#5E564C;--dim:#8A8177;--f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px 24px;box-shadow:0 1px 2px rgba(26,22,19,.05),0 18px 46px rgba(26,22,19,.08)}
.av{width:44px;height:44px;border-radius:12px;background:var(--red-050);border:1px solid #F7D3CF;display:grid;place-items:center;font-family:var(--m);font-weight:600;font-size:16px;color:var(--red-600);margin-bottom:18px}
h1{font-size:20px;letter-spacing:-.02em;font-weight:700}
p.sub{color:var(--muted);font-size:13.5px;margin:4px 0 20px}
label{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field{position:relative}
input{width:100%;font:inherit;font-size:15px;color:var(--txt);background:#FCFBF9;border:1px solid var(--line2);border-radius:10px;padding:11px 44px 11px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,25,25,.12)}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--dim);cursor:pointer;border-radius:8px;font-size:12px;font-family:var(--m)}
.eye:hover{color:var(--txt)}
button.go{width:100%;margin-top:14px;font:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--red);border:0;border-radius:10px;padding:11px;cursor:pointer;transition:background .15s}
button.go:hover{background:var(--red-600)}
button.go:disabled{opacity:.6;cursor:progress}
.err{min-height:20px;margin-top:10px;font-size:13px;color:var(--red-600)}
.foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="av">RV</div>
  <h1>Painel SEO · Reversee</h1>
  <p class="sub">Acesso restrito. Digite a senha enviada pela V4 para abrir o painel.</p>
  <label for="pw">Senha</label>
  <div class="field">
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="button" class="eye" id="eye" aria-label="Mostrar senha">ver</button>
  </div>
  <button class="go" id="go" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">V4 Company · Traffic Analytics</div>
</form>

  var $=function(i){return document.getElementById(i)};
  var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
  var b64e=function(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
  function open(html){document.open();document.write(html);document.close()}
  async function decrypt(key){
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
    return new TextDecoder().decode(buf);
  }
  async function deriveRaw(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,256));
  }
  function importKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
  if(!window.crypto||!crypto.subtle){$('err').textContent='Este navegador não suporta o acesso seguro. Use um navegador atualizado (https).';$('go').disabled=true;return}
  /* reabre sem pedir a senha de novo na mesma aba */
  try{var k=sessionStorage.getItem('rv-k');if(k){importKey(b64(k)).then(decrypt).then(open).catch(function(){sessionStorage.removeItem('rv-k')})}}catch(_){}
  $('eye').onclick=function(){var p=$('pw');var show=p.type==='password';p.type=show?'text':'password';$('eye').textContent=show?'ocultar':'ver'};
  $('f').onsubmit=async function(e){
    e.preventDefault();$('err').textContent='';$('go').disabled=true;$('go').textContent='Verificando…';
    try{
      var raw=await deriveRaw($('pw').value);
      var html=await decrypt(await importKey(raw));
      try{sessionStorage.setItem('rv-k',b64e(raw))}catch(_){}
      open(html);
    }catch(_){
      $('err').textContent='Senha incorreta. Confira e tente de novo.';
      $('go').disabled=false;$('go').textContent='Entrar';$('pw').select();
    }
